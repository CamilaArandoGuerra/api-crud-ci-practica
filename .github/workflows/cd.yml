name: CD - Build, Push and Scan and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extraer metadatos (etiquetas SHA y latest)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/mi-app
          tags: |
            type=sha,format=long
            latest

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/mi-app:${{ github.sha }}
          format: 'table'
          exit-code: '0'       # <--- Esto debe estar en '0' para que no falle el pipeline
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar en produccion
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USERNAME }}/mi-app:latest"
            
            # Limpieza previa de contenedores de prueba huérfanos
            docker rm -f mi-app-new || true
            
            # 1. Descargar la nueva imagen y levantarla en el puerto temporal 3005 para validación
            docker pull $IMAGE
            docker run -d \
              --name mi-app-new \
              --restart unless-stopped \
              -p 3005:3000 \
              $IMAGE
            
            # 2. Esperar 10 segundos a que la aplicación inicialice correctamente
            sleep 10
            
            # 3. Health check automatizado contra la ruta raíz /
            if curl -sf http://localhost:3005/; then
              echo "Health check exitoso. Reemplazando contenedor en producción..."
              
              # 4. Apagar y eliminar el contenedor activo anterior
              docker stop mi-app || true
              docker rm mi-app || true
              
              # 5. Levantar el nuevo contenedor definitivo en el puerto público 80
              docker run -d \
                --name mi-app \
                --restart unless-stopped \
                -p 80:3000 \
                $IMAGE
              
              # 6. Limpiar el contenedor temporal de pruebas
              docker rm -f mi-app-new || true
            else
              echo "Health check FALLIDO. Abortando despliegue..."
              docker logs mi-app-new
              docker rm -f mi-app-new || true
              exit 1
            fi
            
            # 7. Limpieza general de imágenes y contenedores huérfanos
            docker system prune -f